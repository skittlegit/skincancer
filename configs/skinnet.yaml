# SkinNet trained from random weights. The recipe is fixed in DECISIONS.md (Training);
# change it there first. `--set key=value` overrides any field for a one-off run.
extends: data.yaml

name: skinnet                  # runs go to runs/<name>/s<seed>/
seed: 0
runs_dir: runs
results_dir: results

data:
  label_col: label_cancer      # not_cancer / cancer
  train_splits: [train]        # manifest splits to train on
  val_splits: [val]            # picks the checkpoint and stops training; never a test split
  img_size: 224
  resize_short: 256            # evaluation: shorter side to 256, centre crop 224
  quality_augment: false       # also degrade resolution / JPEG quality at random when training

model:
  width: 32                    # channels of the first stage; doubles every stage
  depths: [2, 2, 2, 2]         # residual blocks per stage
  drop: 0.3                    # dropout before the final linear layer

train:
  epochs: 60
  warmup_epochs: 3             # linear warm-up, then cosine decay to zero
  patience: 15                 # stop after this many epochs without a better val AUC (0 = never)
  lr: 1.0e-3                   # AdamW, every layer
  weight_decay: 0.05
  label_smoothing: 0.1
  class_weighting: balanced    # balanced | none: weight of each class in the loss
  sampling: none               # none | source_class | source_class_type: which images an epoch draws
  select_metric: auc           # auc | source_auc: the validation score that picks the checkpoint
  batch_size: 32
  num_workers: 8               # processes that load and augment images
  amp: true                    # mixed precision, GPU only

eval:
  # Predicted automatically after training. Test-only sets (ddi_test, dermacon_test,
  # dermacon_other, midas_test) are never here: they go through `predict --final`.
  splits: [val, test, ak_side]
  tta: false                   # average over the four flips when predicting
